[Unit]
# Kaos: clears the reverse BindsTo=phosh.service upstream's own
# 20-phosh.conf sets on THIS unit (android-service@hwcomposer.service.d/
# 20-phosh.conf sorts before 30-nobind.conf, so this one wins).
# Confirmed live (2026-08-22): that reverse binding meant every
# phosh.service restart (RestartSec=5s, phosh.service:42-43) forced this
# unit to stop too, which ran android-service.sh's own stop() ->
# /system/bin/stop vendor.hwcomposer-2-3 -> SIGKILL to the real composer
# HAL process 230-250ms after each fresh start (kmsg-measured across 6
# cycles, never once longer) -- nowhere near enough time for it to open
# the real DRM/display devices and reach registerAsService() before being
# killed again on the next phosh retry. phosh.service's own forward
# dependency (40-droid-wait.conf's BindsTo=/Requires=/After=
# android-service@hwcomposer.service) is untouched -- phosh still won't
# start until this unit does, only the destructive reverse direction is
# removed. A bare "BindsTo=" clears the previously-configured value
# (list-type directive semantics), same technique already used for
# phosh.service.d/60-disable-chvt.conf's ExecStartPost= earlier the same
# day.
#
# NOTE: This is a necessary-but-not-sufficient partial mitigation.  The
# full root cause of the phosh.service/android-service@hwcomposer.service
# kill-cycle is still open; see docs/exec-plans/tech-debt-tracker.md
# TRD-043 ("phosh.service crash chain").
BindsTo=
