[Service]
# Kaos: redirect android_boot_completed.service output to persistent
# files and run a property diagnostic immediately before the real start,
# matching the runtime drop-in previously deployed by SetupManager.java.
StandardOutput=append:/var/log/android-boot-completed-stdout.log
StandardError=append:/var/log/android-boot-completed-stderr.log
ExecStartPre=-/usr/bin/python3 /usr/libexec/lxc-android-config/property-diag.py
