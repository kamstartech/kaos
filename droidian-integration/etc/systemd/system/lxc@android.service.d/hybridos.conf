[Unit]
# Kaos: trampoline already runs mount-android-system before systemd
# starts, so do NOT require the systemd-triggered unit here -- a
# redundant run fails and would block lxc@android from starting.  Keep
# only the upstream lxc-android-config helper units that are still
# needed.  See docs/exec-plans/tech-debt-tracker.md TRD-043.
Requires=lxc-android-config-mount-apexes.service mount-halium-overlay.service lxc-android-config-generate-binds.service
After=lxc-android-config-mount-apexes.service mount-halium-overlay.service lxc-android-config-generate-binds.service

[Service]
# lxc-start's own "container failed to start" error explicitly asks for
# this -- its default log level doesn't say WHY the internal startup
# sync failed.
#
# Droidian ships its own full override at /etc/systemd/system/lxc@android.service
# with Type=notify and ExecStartPre=/usr/bin/lxc-start -d -n android (the
# actual container start) followed by ExecStart=/usr/lib/lxc-android/lxc-android-notify.
# We therefore override ExecStartPre= to add debug logging on the real
# startup command, leaving ExecStart= (the notify wrapper) untouched.
ExecStartPre=
ExecStartPre=/usr/bin/lxc-start -d -n %i --logfile=/var/log/lxc-android-debug.log --logpriority=DEBUG
