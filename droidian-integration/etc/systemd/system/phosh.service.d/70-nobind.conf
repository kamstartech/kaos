[Unit]
# Kaos: clears phosh.service's own BindsTo=android-service@hwcomposer.service
# (set by upstream's 40-droid-wait.conf, sorts before this file). Requires=
# and After= (also in 40-droid-wait.conf, untouched) alone are sufficient
# for what phosh actually needs -- hwcomposer up before phosh starts --
# with no stop-cascade risk in either direction. Companion fix to
# android-service@hwcomposer.service.d/30-nobind.conf (clears that unit's
# own reverse BindsTo=phosh.service): clearing only ONE side did not stop
# the SIGKILL cycle documented there -- confirmed live (2026-08-22) that
# phosh.service failing still triggered
# "android-service@hwcomposer.service: Trying to enqueue job .../stop"
# even with the reverse BindsTo= cleared, so clearing both sides is the
# more robust fix -- BindsTo= isn't needed for correctness here at all,
# only for the destructive coupling.
#
# NOTE: This is a necessary-but-not-sufficient partial mitigation.  The
# full root cause of the phosh.service/android-service@hwcomposer.service
# kill-cycle is still open; see docs/exec-plans/tech-debt-tracker.md
# TRD-043 ("phosh.service crash chain").
BindsTo=
