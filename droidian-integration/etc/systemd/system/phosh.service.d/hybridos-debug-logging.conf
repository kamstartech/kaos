[Service]
# Kaos: redirect phosh/phoc stdout/stderr to persistent files.  journald
# persistent storage does not initialize reliably on this project's
# current device/kernel setup, and systemd's kmsg forwarding gets
# throttled during the crash window, so the unit's own configured fds are
# the only reliable place to capture phoc's real startup errors.
StandardOutput=append:/var/log/phosh-stdout.log
StandardError=append:/var/log/phosh-stderr.log
