# Kaos device declaration
# Location: /system/etc/kaos/device.conf (source: kaos/scripts/device.conf)
#
# Hardware constants for the current device, so porting to another device is a
# data change here rather than edits scattered through kaos-service/kaos-init.
# Sourced with safe defaults (see kaos-service), so a missing file is safe.
#
# Defaults below are for perseus (Xiaomi Mi MIX 3, sdm845).

# DRM device nodes (major 226 = drm on this kernel). card0 is the DSI panel,
# renderD128 the render node used by wlroots/GL.
DEV_DRM_CARD_MAJOR=226
DEV_DRM_CARD_MINOR=0
DEV_DRM_RENDER_MAJOR=226
DEV_DRM_RENDER_MINOR=128
DEV_DRM_CARD=/dev/dri/card0
DEV_DRM_RENDER=/dev/dri/renderD128

# Panel resolution used when `wm size` can't be queried (fallback only).
DEV_DISPLAY_SIZE=1080x2340

# Mesa/KGSL (Adreno) install prefix inside the distro rootfs.
DEV_MESA_KGSL=/usr/local/mesa-kgsl
