# Plain Ubuntu 24.04 base built by hybris/kaos-configs/build-rootfs.sh
# (--distro ubuntu). Formerly the anonymous "kaos_mainline" test slot; renamed
# now that the rootfs is a real Ubuntu and other distros (kali, debian) get the
# same treatment.
[ubuntu]
type=directory
path=ubuntu
arch=arm64
shell=/bin/bash
init=/sbin/init
hostname=kaos-ubuntu
status=available
url=local
archive_format=tar.xz
mode=hybridos
official_path=/data/.stowaway/ubuntu

