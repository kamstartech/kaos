# Kaos Distro Registry
# Location: /data/.stowaway/distros.conf
#
# Each section defines a distro that can be bootstrapped and run.
# type: directory (tarball-based) or image (ext4 loop mount)
# path: relative to /data/.stowaway/ (used in hybridos mode)
# mode: official (use official_path) or hybridos (use /data/.stowaway/{path})
# official_path: absolute path for official install location (empty = hybridos-only)
# status: installed | available | downloading
# archive_format: tar.xz | tar.gz | tar.bz2 | img
#
# Decluttered to focus on [ubuntu] while the LXC-like container work is
# being built out one verified step at a time. Every other entry below is
# commented out, not deleted -- uncomment a block to bring it back. This only
# affects the source template; nothing already installed on the device
# (/data/.stowaway/kali_native, /data/.stowaway/sailfish, etc.) is touched --
# the live on-device /data/.stowaway/distros.conf is a separate copy that only
# re-seeds from this file on first boot or if missing.

